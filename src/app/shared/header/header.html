<header>
    <nav class="nav-desktop">
        <section class="btn-nav">
            <div class="switch">
                <input id="language-toggle-desktop" class="check-toggle check-toggle-round-flat" type="checkbox"
                    [checked]="isLanguageEnglish()" (change)="setLanguage($event)">
                <label for="language-toggle-desktop"></label>
                <span class="on">DE</span>
                <span class="off">EN</span>
            </div>
        </section>
        <a class="dot-hover about" [routerLink]="['/']" fragment="about-me">{{"HEADER.NAV.ABOUT_ME" | translate }}</a>
        <a class="dot-hover" [routerLink]="['/']" fragment="skills">{{"HEADER.NAV.SKILLS" | translate }}</a>
        <a class="dot-hover" [routerLink]="['/']" fragment="projects">{{"HEADER.NAV.PROJECTS" | translate }}</a>
    </nav>
    <section class="logo-wrapper">
        <a [routerLink]="['/']" fragment="top" aria-label="Go to top of page">
            <img class="initials" src="/assets/icons/shared/logo.svg" alt="Initials">
            <img class="initials-hover" src="/assets/icons/shared/logo-outline.png" alt="Initials Outline">
            <img class="name" src="/assets/icons/shared/name.png" alt="Name">
            <img class="name-hover" src="/assets/icons/shared/name-outline.png" alt="Name Outline">
        </a>
    </section>

    <section class="nav-mobile-wrapper">
        <section class="nav-mobile">
            <section class="logo-mobile">
                <img src="/assets/icons/shared/logo.svg" alt="Logo">
            </section>
            <button class="burger-button button-img" [class.active]="isMenuOpen()" (click)="toggleMenu()"
                [attr.aria-expanded]="isMenuOpen()" aria-label="Menue open/close">
                <img src="/assets/icons/shared/menu.png" alt="Burger Menu">
            </button>

        </section>
        @if (isMenuOpen() && isMenuOpenedByButton()) {
        <nav class="menu-nav">
            <a [routerLink]="['/']" fragment="about-me" (click)="closeMenu()">{{"HEADER.NAV.ABOUT_ME" | translate }}</a>
            <a [routerLink]="['/']" fragment="skills" (click)="closeMenu()">{{"HEADER.NAV.SKILLS" | translate }}</a>
            <a [routerLink]="['/']" fragment="projects" (click)="closeMenu()">{{"HEADER.NAV.PROJECTS" | translate }}</a>
            <div class="mobile-switch">
                <div class="switch">
                    <input id="language-toggle-mobile" class="check-toggle check-toggle-round-flat" type="checkbox"
                        [checked]="isLanguageEnglish()" (change)="setLanguage($event)">
                    <label for="language-toggle-mobile"></label>
                    <span class="on">DE</span>
                    <span class="off">EN</span>
                </div>
            </div>
        </nav>
        }
    </section>
</header>
