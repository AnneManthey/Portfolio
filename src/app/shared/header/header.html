<header>
    <nav>
        <section class="btn-nav">
            <div class="switch">
                <input id="language-toggle" class="check-toggle check-toggle-round-flat" type="checkbox">
                <label for="language-toggle"></label>
                <span class="on">EN</span>
                <span class="off">DE</span>
            </div>
        </section>
        <a class="dot-hover" [routerLink]="['/']" fragment="about-me">About me</a>
        <a class="dot-hover" [routerLink]="['/']" fragment="skills">Skills</a>
        <a class="dot-hover" [routerLink]="['/']" fragment="projects">Projects</a>
        <!-- <a class="dot-hover" [routerLink]="['/']" fragment="references">References</a>
        <a class="dot-hover" [routerLink]="['/']" fragment="contact">Contact</a> -->
    </nav>
    <section class="logo-wrapper">
        <a [routerLink]="['/']" fragment="top" aria-label="Go to top of page">
            <img class="initials" src="/assets/icons/shared/logo.svg" alt="Initials">
            <img class="initials-hover" src="/assets/icons/shared/logo-outline.png" alt="Initials Outline">
            <img class="name" src="/assets/icons/shared/name.png" alt="Name">
            <img class="name-hover" src="/assets/icons/shared/name-outline.png" alt="Name Outline">
        </a>
    </section>
</header>
