<body>
  <div
  class="cursor-glow"
  [style.left.px]="cursorGlow().x"
  [style.top.px]="cursorGlow().y"
></div>
@if (isHomeRoute) {
<section class="hero-frame">
  <app-header></app-header>
  <section id="top" class="page-section">
    <app-hero></app-hero>
  </section>
</section>
<section id="about-me" class="page-section">
  <app-about-me></app-about-me>
</section>
<section id="skills" class="page-section">
  <app-skills></app-skills>
</section>
<section id="projects" class="page-section">
  <app-projects></app-projects>
</section>
<section id="references" class="page-section">
  <app-references></app-references>
</section>
<section id="contact" class="page-section">
  <app-contact></app-contact>
</section>
<router-outlet />
} @else if (isLegalOrPrivacyRoute) {
<section class="hero-frame">
  <app-header></app-header>
  <router-outlet />
</section>
} @else {
<app-header></app-header>
<router-outlet />
}

<app-footer></app-footer>
</body>
