<section class="hero">
    <section class="hero-main">
        <p>Fullstack Developer</p>
        <h1>Anne Manthey</h1>
        <div class="hero-btn">
            <button class="animated-btn" [routerLink]="['/']" fragment="projects">
                <span class="btn-text" [attr.data-text]="'HERO.WORK' | translate">{{"HERO.WORK" | translate }}</span>
            </button>
            <button class="animated-btn" [routerLink]="['/']" fragment="contact">
                <span class="btn-text" [attr.data-text]="'HERO.CONTACT' | translate">{{"HERO.CONTACT" | translate
                    }}</span>
            </button>
        </div>
    </section>

    <section class="hero-contact">
        <div class="hero-contact-deco">
            <div class="hero-contact-deco-arrows" aria-hidden="true">
                <img class="hero-contact-arrow-container" src="/assets/icons/pages/Arrow Container.png" alt="Moving Arrow">
                <img class="hero-contact-arrow-moving" src="/assets/icons/pages/Arrow 2.png" alt="Moving Arrow">
            </div>
            <div class="line1"></div>
        </div>
        <div class="hero-contact-links">
            <div class="hero-contact-links-row">
                <a class="hero-email" href="mailto:anne.manthey@pm.me">anne.manthey@pm.me</a>
                <a class="hero-link mail-mobile" href="mailto:anne.manthey@pm.me"
                    aria-label="Send email to Anne Manthey">
                    <img class="icon" src="/assets/icons/pages/Mail.png" alt="Email">
                    <img class="icon-hover" src="/assets/icons/pages/Mail Hover.png" alt="Email">
                </a>
                <a class="hero-link" href="https://github.com/AnneManthey" target="_blank"
                    aria-label="Open Anne Manthey's GitHub profile in a new tab">
                    <img class="icon" src="/assets/icons/pages/GitHub.png" alt="Github">
                    <img class="icon-hover" src="/assets/icons/pages/GitHub Hover.png" alt="Github">
                </a>
                <a class="hero-link" href="https://www.linkedin.com/in/anne-manthey-a318a6260/" target="_blank"
                    aria-label="Open Anne Manthey's LinkedIn profile in a new tab">
                    <img class="icon" src="/assets/icons/pages/Linkedin.png" alt="LinkedIn">
                    <img class="icon-hover" src="/assets/icons/pages/Linkedin Hover.png" alt="LinkedIn">
                </a>
            </div>
            <div class="line2"></div>
        </div>
    </section>

    <section class="hero-banner" aria-label="Status Banner">
        <div class="hero-banner-track" aria-hidden="true">
            <span class="hero-banner-item">{{"HERO.REMOTE" | translate }}</span>
            <img class="hero-banner-dot" src="/assets/icons/shared/hover-dot.png" alt="Dot">
            <span class="hero-banner-item">Fullstack Developer</span>
            <img class="hero-banner-dot" src="/assets/icons/shared/hover-dot.png" alt="Dot">
            <span class="hero-banner-item">{{"HERO.BASED" | translate }}</span>
            <img class="hero-banner-dot" src="/assets/icons/shared/hover-dot.png" alt="Dot">
            <span class="hero-banner-item">{{"HERO.OPEN" | translate }}</span>
            <img class="hero-banner-dot" src="/assets/icons/shared/hover-dot.png" alt="Dot">

            <span class="hero-banner-item">{{"HERO.REMOTE" | translate }}</span>
            <img class="hero-banner-dot" src="/assets/icons/shared/hover-dot.png" alt="Dot">
            <span class="hero-banner-item">Fullstack Developer</span>
            <img class="hero-banner-dot" src="/assets/icons/shared/hover-dot.png" alt="Dot">
            <span class="hero-banner-item">{{"HERO.BASED" | translate }}</span>
            <img class="hero-banner-dot" src="/assets/icons/shared/hover-dot.png" alt="Dot">
            <span class="hero-banner-item">{{"HERO.OPEN" | translate }}</span>
            <img class="hero-banner-dot" src="/assets/icons/shared/hover-dot.png" alt="Dot">
        </div>
    </section>
</section>
