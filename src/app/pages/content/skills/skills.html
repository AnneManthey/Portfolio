<section class="skills">
    <section class="skills-text">
        <h2>{{"SKILLS.TECH" | translate }}</h2>
        <article class="skills-text-box">
            <h3>{{"SKILLS.H1" | translate }}</h3>
            <p>{{"SKILLS.P1" | translate }}</p>
            <h2><span style="color: var(--font-light);">{{"SKILLS.P2" | translate }}</span>{{"SKILLS.P2.1" | translate
                }}</h2>
            <p style="font-size: 1rem;">{{"SKILLS.P3" | translate }}
            </p>
            <button class="animated-btn" [routerLink]="['/']" fragment="contact">
                <span class="btn-text" [attr.data-text]="'SKILLS.BTN' | translate">{{"SKILLS.BTN" | translate }}</span>
            </button>
        </article>
    </section>
    <article class="skills-icons">
        @for(item of skillList; track item.name){
        <article class="skills-icons-box">
            <img [src]="item.src" [alt]="item.name">
            <p>{{item.name}}</p>
        </article>
        }
        <article class="skills-icons-box mindset-box">
            <img src="/assets/icons/pages/skills/GrowthMindset.png" alt="Mindset">
            <img class="mindset-hover" src="/assets/icons/pages/skills/Growth-hover.png" alt="Mindset">
            <p>Growth Mindset</p>
        </article>
    </article>
</section>
