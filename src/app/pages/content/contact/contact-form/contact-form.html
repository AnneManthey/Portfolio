<form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">
    <section>

        <div class="form-group" [class.is-invalid]="isInvalid('name')">
            <label for="name">{{"CONTACT.FORM.NAME" | translate }}</label>
            <input id="name" type="text" formControlName="name" (focus)="resetField('name')"
                (blur)="clearIfInvalid('name')"
                autocomplete="name"
                [placeholder]="isInvalid('name') ? ('CONTACT.FORM.NAME_ERR' | translate) : ('CONTACT.FORM.NAME_PLACE' | translate)" />
        </div>
        <div class="form-group" [class.is-invalid]="isInvalid('email')">
            <label for="email">{{"CONTACT.FORM.MAIL" | translate }}</label>
            <input id="email" type="email" formControlName="email" (focus)="resetField('email')"
                (blur)="clearIfInvalid('email')"
                autocomplete="email"
                [placeholder]="isInvalid('email') ? ('CONTACT.FORM.MAIL_ERR' | translate) : ('CONTACT.FORM.MAIL_PLACE' | translate)" />
        </div>
        <div class="form-group" [class.is-invalid]="isInvalid('message')">
            <label for="message">{{"CONTACT.FORM.MSG" | translate }}</label>
            <textarea id="message" formControlName="message" rows="3" (focus)="resetField('message')"
                (blur)="clearIfInvalid('message')"
                [placeholder]="isInvalid('message') ? ('CONTACT.FORM.MSG_ERR' | translate) : ('CONTACT.FORM.MSG_PLACE' | translate)"></textarea>
        </div>
        <div class="form-group checkbox-group" [class.is-invalid]="isInvalid('privacy')">
            <div class="form-checkbox-wrapper">
                <div class="form-checkbox">
                    <input id="privacy" type="checkbox" formControlName="privacy" />
                    <span class="checkmark"></span>
                </div>
                <label for="privacy" class="form-privacy-text">
                    {{"CONTACT.FORM.PRIVACY1" | translate }} <a routerLink="/privacy-policy">{{"CONTACT.FORM.PRIVACY2" |
                        translate }}</a> {{"CONTACT.FORM.PRIVACY3" | translate }}
                </label>
            </div>
            @if (isInvalid('privacy')) {
            <span class="error-message">{{"CONTACT.FORM.PRIVACY_ERR" | translate }}</span>
            }
        </div>
    </section>

    <section class="contact-form-btn-wrapper">
        <div class="form-actions">
            <button type="submit" [disabled]="contactForm.invalid || isSending">
                {{ isSending ? ('CONTACT.FORM.SENDING' | translate) : ('CONTACT.FORM.BTN' | translate) }}
            </button>
            @if (submitError) {
            <div class="error-msg">
                {{ "CONTACT.FORM.SEND_ERROR" | translate }}
            </div>
            }
        </div>
        @if (isSubmitted) {
        <div class="success-msg">
            {{"CONTACT.FORM.RECEIVED1" | translate }}<br> {{"CONTACT.FORM.RECEIVED2" | translate }}
        </div>
        }
    </section>
</form>
